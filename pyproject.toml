[project]
name = "structured-data-extraction"
version = "0.1.0"
description = "Structured data extraction from insurance documents using Claude API — CCA-F Scenario 6"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Behram Korkut" }
]
dependencies = [
    "anthropic>=0.100.0",
    "pdfplumber>=0.11.9",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
